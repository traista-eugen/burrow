[package]
name = "burrow-msp"
description = "Client for Muse Code's MSP protocol (`muse serve`), independent of Burrow's other crates"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
jsonschema.workspace = true
schemars.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
