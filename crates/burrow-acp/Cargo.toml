[package]
name = "burrow-acp"
description = "A thin ACP (Agent Client Protocol) client: drives one agent process over its stdio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No dependency on burrow-protocol or any other Burrow crate: this crate exposes
# its own typed API, and burrowd's adapter maps it to Burrow session events.
[dependencies]
agent-client-protocol.workspace = true
futures.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
