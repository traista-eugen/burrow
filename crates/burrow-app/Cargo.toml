[package]
name = "burrow-app"
description = "Burrow desktop client (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "burrow"
path = "src/main.rs"

[dependencies]
burrow-client.workspace = true
burrow-protocol.workspace = true
burrow-transport.workspace = true
futures.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
gpui_platform.workspace = true
serde_json.workspace = true
# Only for the I/O runtime burrow-client runs on (D-016) and a `watch` channel; the UI runs on
# GPUI's executor.
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
