[workspace]
resolver = "3"
members = [
    "crates/burrow-protocol",
    "crates/burrowd",
    "crates/burrow-app",
    "crates/burrow-store",
    "crates/burrow-transport",
    "crates/burrow-client",
    "crates/burrowctl",
    "xtask",
    "crates/burrow-agents",
    "crates/burrow-acp",
    "crates/burrow-msp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
burrow-protocol = { path = "crates/burrow-protocol" }
burrow-store = { path = "crates/burrow-store" }
burrow-transport = { path = "crates/burrow-transport" }
burrow-client = { path = "crates/burrow-client" }
burrow-agents = { path = "crates/burrow-agents" }
burrow-acp = { path = "crates/burrow-acp" }
# GPUI, as the `gpui-pre` snapshot that gpui-component is built on (D-028). These four are
# pinned exactly and upgraded together. On Windows, `gpui_platform` turns on GPUI's
# `windows-manifest` feature, so GPUI's manifest is burrow.exe's (D-028 replaces D-010).
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false, features = ["font-kit"] }
# Widgets for the desktop app: text input, markdown, lists, dialogs, themes (D-028).
gpui-component = "=0.9.1"
# gpui-component's bundled Lucide icons, registered as the app's asset source.
gpui-kit-assets = "=0.9.1"
# Line diffs for the transcript's diff cards; the version gpui-component already uses.
similar = "2.7"
# Serialization, shared by every crate. Crates enable extra features themselves,
# e.g. serde_json's raw_value in burrow-store.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Protocol: JSON Schema export, and the one time type every crate uses.
schemars = "1.2.3"
jiff = "0.2.41"
jsonschema = { version = "0.61.0", default-features = false }
# Event store.
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
# Service and clients. Crates enable the tokio features they use.
tokio = "1.54.1"
futures = "0.3.34"
futures-core = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
clap = { version = "4.6.7", features = ["derive", "env"] }
uuid = { version = "1.29.2", features = ["v7"] }
windows-sys = "0.61.2"
# `cargo xtask icons`: SVG to PNG. Same version GPUI already uses; no text or
# embedded raster images in our icons, so their features stay off.
resvg = { version = "0.45.1", default-features = false }
# burrow-acp: the ACP client. `agent-client-protocol` pins its schema crate
# exactly; use its types through `agent_client_protocol::v1::schema`.
agent-client-protocol = "5.0.0"
tokio-util = "0.7.20"
# Muse Code's MSP client.
burrow-msp = { path = "crates/burrow-msp" }
# Terminal emulation in burrowd, one emulator per terminal session (M4). Without its serde
# feature: nothing of it is serialized.
alacritty_terminal = { version = "0.26.0", default-features = false }

# Optimise dependencies (GPUI, its renderer, etc.) even in dev builds so the UI
# stays smooth while iterating; our own crates still compile fast and debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
