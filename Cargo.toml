[workspace]
resolver = "3"
members = ["crates/burrow-protocol", "crates/burrowd", "crates/burrow-app", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
burrow-protocol = { path = "crates/burrow-protocol" }
# Default features minus `windows-manifest`: burrow-app embeds its own manifest
# (adds long-path + UTF-8 code page), and two manifests fail to link.
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
# Protocol: wire types, JSON Schema export, and the one time type every crate uses.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
jiff = "0.2.41"
jsonschema = { version = "0.61.0", default-features = false }

# Optimise dependencies (GPUI, its renderer, etc.) even in dev builds so the UI
# stays smooth while iterating; our own crates still compile fast and debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
