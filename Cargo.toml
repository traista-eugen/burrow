[workspace]
resolver = "3"
members = [
    "crates/burrow-protocol",
    "crates/burrowd",
    "crates/burrow-app",
    "crates/burrow-store",
    "crates/burrow-transport",
    "crates/burrow-client",
    "crates/burrowctl",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
burrow-protocol = { path = "crates/burrow-protocol" }
burrow-store = { path = "crates/burrow-store" }
burrow-transport = { path = "crates/burrow-transport" }
burrow-client = { path = "crates/burrow-client" }
# Default features minus `windows-manifest`: burrow-app embeds its own manifest
# (adds long-path + UTF-8 code page), and two manifests fail to link.
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
# Serialization, shared by every crate. Crates enable extra features themselves,
# e.g. serde_json's raw_value in burrow-store.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Protocol: JSON Schema export, and the one time type every crate uses.
schemars = "1.2.3"
jiff = "0.2.41"
jsonschema = { version = "0.61.0", default-features = false }
# Event store.
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
# Service and clients. Crates enable the tokio features they use.
tokio = "1.54.1"
futures = "0.3.34"
futures-core = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
clap = { version = "4.6.7", features = ["derive", "env"] }
uuid = { version = "1.29.2", features = ["v7"] }
windows-sys = "0.61.2"

# Optimise dependencies (GPUI, its renderer, etc.) even in dev builds so the UI
# stays smooth while iterating; our own crates still compile fast and debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
